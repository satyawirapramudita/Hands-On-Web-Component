<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Components Demo</title>
    <script src="counter-display.js"></script>
    <script src="counter-controls.js"></script>
    <script src="combined-counter.js"></script>
    <script src="NamaDanNIM.js"></script>

    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin: 0;
        padding: 20px;
      }

      nama-dan-nim {
        font-size: clamp(1rem, 2vw, 1.5rem);
        text-align: center;
      }

      combined-counter {
        width: 90%;
        max-width: 500px;
        min-width: 250px;
        box-sizing: border-box;
        transform: scale(1);
        transition: all 0.3s ease;
      }

      /* Adjust layout for tablets */
      @media (min-width: 600px) {
        body {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
        }

        combined-counter {
          width: 45%;
        }
      }

      /* Desktop layout */
      @media (min-width: 900px) {
        combined-counter {
          width: 30%;
        }
      }
    </style>
  </head>

  <body>
    <nama-dan-nim nama="SATYA WIRA PRAMUDITA" nim="24/543649/PA/23102"></nama-dan-nim>

    <combined-counter title="Lorem Ipsum Title" value="99"></combined-counter>
    <combined-counter title="Lorem Ipsum Title" value="99"></combined-counter>
    <combined-counter title="Lorem Ipsum Title" value="99"></combined-counter>
    <combined-counter title="Lorem Ipsum Title" value="99"></combined-counter>

    <script>
      const display = document.getElementById("display");
      const controls = document.getElementById("controls");

      if (controls && display) {
        controls.addEventListener("count-change", (e) => {
          display.count += e.detail.delta;
        });
      }
    </script>
  </body>
</html>
<combined-counter> </combined-counter>
