<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Components Demo</title>
    <script src="counter-display.js" defer></script>
    <script src="counter-controls.js"></script>
    <script src="combined-counter.js" defer></script>
    <script src="NamaDanNIM.js"></script>

    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        background-color: #fafafa;
      }

      nama-dan-nim {
        font-size: clamp(1rem, 2vw, 1.5rem);
        text-align: center;
        margin-bottom: 20px;
      }

      /* Container for counters */
      .counter-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        width: 100%;
        max-width: 1200px;
        box-sizing: border-box;
        justify-items: center;
      }

      combined-counter {
        width: 90%;
        max-width: 400px;
        min-width: 250px;
        transition: all 0.3s ease;
      }

      /* Tablet layout (≥600px): two columns */
      @media (min-width: 600px) {
        .counter-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* Desktop layout (≥900px): three columns */
      @media (min-width: 900px) {
        .counter-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Large desktop (≥1200px): four columns */
      @media (min-width: 1200px) {
        .counter-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
    </style>
  </head>

  <body>
    <nama-dan-nim nama="SATYA WIRA PRAMUDITA" nim="24/543649/PA/23102"></nama-dan-nim>

    <!-- Komponen 1 -->
    <counter-display title="Lorem Ipsum Title" value="99"></counter-display>
    <!-- Komponen 2 -->
    <counter-controls id="controls"></counter-controls>

    <div class="counter-grid">
      <combined-counter title="Pemain 1" value="0"></combined-counter>
      <combined-counter title="Pemain 2" value="0"></combined-counter>
      <combined-counter title="Pemain 3" value="0"></combined-counter>
      <combined-counter title="Pemain 4" value="0"></combined-counter>
    </div>

    <script>
      const display = document.getElementById("display");
      const controls = document.getElementById("controls");

      if (controls && display) {
        controls.addEventListener("count-change", (e) => {
          display.count += e.detail.delta;
        });
      }
    </script>
  </body>
</html>
